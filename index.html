*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#171923;--surface2:#1e2130;--surface3:#252a3d;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.12);
  --text:#e8eaf0;--text2:#8b92a8;--text3:#565e7a;

  --warning:#f59e0b;--warning-bg:rgba(245,158,11,0.1);
  --danger:#ef4444;--danger-bg:rgba(239,68,68,0.1);

  --radius:8px;--radius-lg:12px;

body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{cursor:pointer;font-family:inherit}
input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--surface3);border-radius:4px}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:210px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.logo{padding:1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.logo-icon{width:32px;height:32px;background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-name{font-size:13px;font-weight:600}
.logo-sub{font-size:10px;color:var(--text3);margin-top:1px}
.nav{padding:8px 0;flex:1}
.ns{font-size:9px;font-weight:600;color:var(--text3);padding:10px 14px 3px;text-transform:uppercase;letter-spacing:.08em}
.ni{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px;color:var(--text2);cursor:pointer;border-left:2px solid transparent;transition:all .15s;position:relative}
.ni:hover{background:var(--surface2);color:var(--text)}
.ni.active{color:var(--accent);border-left-color:var(--accent);background:var(--accent-bg)}
.ni i{font-size:14px;width:16px;flex-shrink:0}
.nb{margin-left:auto;background:var(--danger);color:#fff;font-size:9px;font-weight:600;padding:1px 5px;border-radius:10px}
.sf{padding:10px 14px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.su{display:flex;align-items:center;gap:7px}
.av{width:28px;height:28px;border-radius:50%;background:var(--accent-bg);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:var(--accent);flex-shrink:0}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:10px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--surface);flex-shrink:0;position:relative}
.topbar-title{font-size:14px;font-weight:600}
.tr{display:flex;align-items:center;gap:8px}
.content{flex:1;overflow-y:auto;padding:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}

.ct{font-size:12px;font-weight:600}

.sg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px}
.sl{font-size:11px;color:var(--text2);margin-bottom:5px}

.ss{font-size:10px;color:var(--text2);margin-top:3px}
.up{color:var(--success)}.dn{color:var(--danger)}

.bs{background:var(--success-bg);color:var(--success)}
.bw{background:var(--warning-bg);color:var(--warning)}
.bd{background:var(--danger-bg);color:var(--danger)}

.bp{background:var(--pro-bg);color:var(--pro)}
.bg{background:var(--surface3);color:var(--text2)}

.btn-p{background:var(--accent);border-color:var(--accent);color:#fff}

.btn-s{background:var(--success);border-color:var(--success);color:#fff}
.btn-sm{padding:3px 8px;font-size:11px}
.row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:none}
.ri{flex:1;min-width:0}
.rn{font-size:12px;font-weight:500}
.rd{font-size:10px;color:var(--text2);margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
th{text-align:left;padding:7px 10px;font-size:10px;font-weight:600;color:var(--text3);border-bottom:1px solid var(--border);background:var(--surface2);text-transform:uppercase;letter-spacing:.05em}
td{padding:8px 10px;border-bottom:1px solid var(--border);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.tw{overflow-x:auto}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}

.tldl{font-size:11px;color:var(--text2);margin-top:1px}

.cah{background:var(--surface2);font-size:10px;font-weight:600;text-align:center;padding:6px;color:var(--text2)}
.cat{background:var(--surface2);font-size:9px;color:var(--text3);display:flex;align-items:center;justify-content:flex-end;padding-right:6px}
.cac{background:var(--surface);padding:3px 4px;min-height:36px}
.ab{border-radius:3px;padding:2px 4px;font-size:9px;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.ab-b{background:var(--accent-bg);color:var(--accent)}
.ab-g{background:var(--success-bg);color:var(--success)}
.ab-o{background:var(--warning-bg);color:var(--warning)}
.ab-r{background:var(--danger-bg);color:var(--danger)}

.tooth{border:1px solid var(--border2);border-radius:5px;padding:5px 2px;text-align:center;cursor:pointer;font-size:8px;background:var(--surface2);transition:all .15s}

.tooth.filling{background:var(--warning-bg);border-color:var(--warning)}

.tooth.crown{background:var(--pro-bg);border-color:var(--pro)}

.pg{display:grid;grid-template-columns:270px 1fr;gap:12px}

.cp{background:var(--surface3);color:var(--text);border-bottom-left-radius:2px}
.cl{background:var(--accent-bg);color:var(--accent);border-bottom-right-radius:2px;margin-left:auto}
.cd{background:var(--success-bg);color:var(--success);border-bottom-right-radius:2px;margin-left:auto}
.lbr{display:flex;align-items:center;gap:10px;padding:8px;background:var(--surface2);border-radius:var(--radius);margin-bottom:6px;border:1px solid var(--border)}

.vp{position:absolute;width:32px;height:32px;background:rgba(0,0,0,.6);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px}

.mc{background:linear-gradient(135deg,var(--accent-bg),var(--surface2));border:1px solid var(--accent-border);border-radius:var(--radius-lg);padding:16px;margin-bottom:14px}
.acb{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px;text-align:center;color:var(--text2)}
.ls{min-height:100vh;background:var(--bg);display:flex;align-items:center;justify-content:center}
.lc{background:var(--surface);border:1px solid var(--border2);border-radius:16px;padding:28px;width:360px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.rg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.rb{padding:10px 6px;text-align:center;border:1px solid var(--border2);border-radius:var(--radius);cursor:pointer;font-size:11px;background:var(--surface2);color:var(--text2);transition:all .15s}

.rb.sel{border:2px solid var(--accent);background:var(--accent-bg);color:var(--accent)}

.wst.active{color:var(--accent);font-weight:500}
.wst.done{color:var(--success)}
.wsn{width:22px;height:22px;border-radius:50%;background:var(--surface3);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;flex-shrink:0}

.wst.done .wsn{background:var(--success);border-color:var(--success);color:#fff}
.wsl{flex:1;height:1px;background:var(--border2);margin:0 6px}
.qrd{width:120px;height:120px;background:#fff;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;margin:0 auto}
@media(max-width:768px){
  .sidebar{width:60px}
  .logo-name,.logo-sub,.ns,.ni span,.sf span:not(.av){display:none}
  .ni{justify-content:center;padding:10px}
  .sg4{grid-template-columns:repeat(2,1fr)}
  .g2{grid-template-columns:1fr}
  .pg{grid-template-columns:1fr}
}
</style>
</head>

const Av = ({name,size=28})=><div className="av" style={{width:size,height:size,fontSize:size*.35}}>{name?.split(' ').map(w=>w[0]).slice(0,2).join('')}</div>;
const Pb = ({v})=><div className="pb"><div className="pf" style={{width:`${v}%`}}/></div>;
const Btn = ({children,type='',sm,onClick,style})=><button className={`btn${type?' btn-'+type:''}${sm?' btn-sm':''}`} onClick={onClick} style={style}>{children}</button>;

const statusBadge = s=>{
  const m={active:['s','Aktif'],followup:['w','Takipte'],noshow:['d','Gelmedi'],came:['s','Geldi'],waiting:['w','Bekliyor'],confirmed:['a','Onaylı']};
  const [t,l]=m[s]||['g',s];
  return <Bx t={t} c={l}/>;
};

        <div className="ws2">
          {['Klinik','Dil','Saatler','Doktor','Hazır'].map((s,i)=>(
            <React.Fragment key={s}>

            </React.Fragment>
          ))}
        </div>
        {step===0&&<div>

          <div className="fr"><div className="fg"><label className="fl">Acil telefon</label><input className="fi" defaultValue="+49 30 1234567"/></div><div className="fg"><label className="fl">Google Review</label><input className="fi" placeholder="https://g.page/r/..."/></div></div>
        </div>}
        {step===1&&<div>
          <div style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>Lena hangi dillerde yanıt versin?</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            {[['🇩🇪','Almanca','DE'],['🇬🇧','İngilizce','EN'],['🇳🇱','Hollandaca','NL'],['🇫🇷','Fransızca','FR'],['🇹🇷','Türkçe','TR']].map(([f,l,c])=>(
              <div key={c} onClick={()=>tl(c)} style={{padding:10,textAlign:'center',border:langs.includes(c)?'2px solid var(--accent)':'1px solid var(--border2)',borderRadius:'var(--radius)',cursor:'pointer',fontSize:13,background:langs.includes(c)?'var(--accent-bg)':'var(--surface2)',color:langs.includes(c)?'var(--accent)':'var(--text2)'}}>
                {f} {l}
              </div>
            ))}
          </div>
        </div>}
        {step===2&&<div>
          <div className="fr"><div className="fg"><label className="fl">Hafta içi başlangıç</label><input className="fi" defaultValue="09:00"/></div><div className="fg"><label className="fl">Hafta içi bitiş</label><input className="fi" defaultValue="18:00"/></div></div>
          <div className="fr"><div className="fg"><label className="fl">Cumartesi başlangıç</label><input className="fi" defaultValue="09:00"/></div><div className="fg"><label className="fl">Cumartesi bitiş</label><input className="fi" defaultValue="13:00"/></div></div>
          <div className="fr"><div className="fg"><label className="fl">Muayene süresi (dk)</label><input className="fi" defaultValue="20" type="number"/></div><div className="fg"><label className="fl">Pazar</label><select className="fi"><option>Kapalı</option><option>Açık</option></select></div></div>
        </div>}
        {step===3&&<div>
          <div style={{fontSize:12,color:'var(--text2)',marginBottom:12}}>Doktorları ekleyin</div>
          <div style={{display:'flex',gap:8,marginBottom:8,alignItems:'center'}}>
            <Av name="Dr Schmidt" size={28}/>
            <input className="fi" defaultValue="Dr. Schmidt" style={{flex:1}}/>
            <input className="fi" defaultValue="schmidt@smile.de" style={{flex:1}}/>
          </div>
          <Btn sm style={{width:'100%',justifyContent:'center',marginTop:4}}><i className="ti ti-plus"/> Doktor ekle</Btn>
        </div>}
        {step===4&&<div style={{textAlign:'center',padding:'12px 0'}}>
          <i className="ti ti-circle-check" style={{fontSize:52,color:'var(--success)',display:'block',marginBottom:12}}/>
          <div style={{fontSize:18,fontWeight:700,marginBottom:6}}>Klinik hazır!</div>
          <div style={{fontSize:12,color:'var(--text2)',marginBottom:16}}>Dental AI sisteminiz kuruldu.</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,textAlign:'left'}}>
            <div style={{background:'var(--success-bg)',borderRadius:'var(--radius)',padding:'8px 10px'}}><div style={{fontSize:11,fontWeight:600,color:'var(--success)',marginBottom:3}}>✓ Aktif</div><div style={{fontSize:11,color:'var(--success)'}}>E-posta, Röntgen YZ, CRM</div></div>
            <div style={{background:'var(--warning-bg)',borderRadius:'var(--radius)',padding:'8px 10px'}}><div style={{fontSize:11,fontWeight:600,color:'var(--warning)',marginBottom:3}}>⚠ Bağlantı bekliyor</div><div style={{fontSize:11,color:'var(--warning)'}}>WhatsApp, SMS, Voice AI</div></div>
          </div>
        </div>}
        <div style={{display:'flex',justifyContent:'space-between',marginTop:20}}>
          <Btn style={{visibility:step===0?'hidden':'visible'}} onClick={()=>setStep(s=>s-1)}><i className="ti ti-arrow-left"/> Geri</Btn>
          {step<4?<Btn type="p" onClick={()=>setStep(s=>s+1)}>Devam et <i className="ti ti-arrow-right"/></Btn>:<Btn type="p" onClick={onDone}>Panele geç <i className="ti ti-arrow-right"/></Btn>}

// MAIN APP
const App = ()=>{
  const [screen,setScreen]=useState('wizard');
  const [role,setRole]=useState('admin');
  const [page,setPage]=useState('dashboard');
  const [notif,setNotif]=useState(false);
  const [profile,setProfile]=useState(null);

  const navigate=(id)=>{
    if(profile)setProfile(null);
    if(BLOCKED[role]?.includes(id)){setPage('blocked');return;}
    setPage(id);setNotif(false);
  };

  const renderPage=()=>{
    if(profile)return <PatientProfile patient={profile} onBack={()=>setProfile(null)}/>;
    switch(page){
      case 'dashboard':return <Dashboard role={role}/>;
      case 'patients':return <Patients role={role} onProfile={p=>setProfile(p)}/>;
      case 'calendar':return <Calendar/>;
      case 'appointments':return <Appointments role={role}/>;
      case 'plans':return <Plans/>;
      case 'xray':return <Xray/>;
      case 'videolib':return <VideoLib/>;
      case 'lab':return <Lab/>;
      case 'whatsapp':return <WhatsApp/>;
      case 'calls':return <Calls/>;
      case 'satisfaction':return <Satisfaction/>;
      case 'lena':return <Lena/>;
      case 'lifetime':return <Lifetime/>;
      case 'report':return <Report/>;
      case 'reminder':return <Reminder/>;
      case 'referral':return <Referral/>;
      case 'payment':return <Payment/>;
      case 'docperf':return <DocPerf/>;
      case 'team':return <Team/>;
      case 'settings':return <Settings/>;
      case 'blocked':return <Blocked/>;
      default:return <Dashboard role={role}/>;
    }
  };

  if(screen==='wizard')return <Wizard onDone={()=>setScreen('login')}/>;
  if(screen==='login')return <Login onLogin={r=>{setRole(r);setScreen('app');setPage('dashboard');}}/>;

  const RL={admin:'Klinik Admin',doctor:'Dr. Schmidt',reception:'Resepsiyon'};
  const RA={admin:'AD',doctor:'DS',reception:'RE'};
  const RC={admin:'p',doctor:'a',reception:'w'};

  return (
    <div className="app">
      <div className="sidebar">
        <div className="logo">
          <div className="logo-icon">🦷</div>
          <div><div className="logo-name">Dental AI</div><div className="logo-sub">Smile Dental Clinic</div></div>
        </div>
        <nav className="nav">
          {NAV[role].map(section=>(
            <React.Fragment key={section.s}>
              <div className="ns">{section.s}</div>
              {section.i.map(item=>(
                <div key={item.id} className={`ni${(profile?'profile':page)===item.id?' active':''}`} onClick={()=>navigate(item.id)}>
                  <i className={`ti ${item.ic}`}/>
                  <span>{item.l}</span>
                  {item.badge&&<span className="nb">{item.badge}</span>}
                </div>
              ))}
            </React.Fragment>
          ))}
        </nav>
        <div className="sf">
          <div className="su">
            <div className="av">{RA[role]}</div>
            <span style={{fontSize:11,fontWeight:500}}>{RL[role]}</span>
          </div>
          <Btn sm onClick={()=>setScreen('login')}>Çıkış</Btn>
        </div>
      </div>
      <div className="main">
        <div className="topbar">
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div className="topbar-title">{profile?`Hasta: ${profile.name}`:TITLES[page]||page}</div>
            <span style={{fontSize:9,padding:'2px 6px',borderRadius:10,fontWeight:600,background:`var(--${RC[role]==='p'?'pro':RC[role]==='a'?'accent':'warning'}-bg)`,color:`var(--${RC[role]==='p'?'pro':RC[role]==='a'?'accent':'warning'})`}}>{RL[role]}</span>
          </div>
          <div className="tr">
            <span style={{fontSize:10,color:'var(--text3)'}}>27 Ağu 2026</span>
            <button className="btn" style={{padding:'5px 8px',position:'relative'}} onClick={()=>setNotif(o=>!o)}>
              <i className="ti ti-bell" style={{fontSize:15}}/>
              <span style={{position:'absolute',top:2,right:2,width:7,height:7,borderRadius:'50%',background:'var(--danger)'}}/>
            </button>
            <Btn type="p" sm><i className="ti ti-plus"/> {role==='doctor'?'Randevu ekle':'Yeni hasta'}</Btn>
          </div>
          <div className={`np${notif?' open':''}`}>
            <div style={{display:'flex',justifyContent:'space-between',marginBottom:8}}>
              <span style={{fontSize:12,fontWeight:600}}>Bildirimler</span>
              <span style={{fontSize:10,color:'var(--accent)',cursor:'pointer'}} onClick={()=>setNotif(false)}>Okundu</span>
            </div>
            {[['ti-phone-incoming','d','Acil — Sophie Klein','Şiddetli ağrı, Lena yönlendirdi','5 dk'],['ti-check','s','Plan kabul — Peter Hoffmann','€3.200 implant planı kabul edildi','23 dk'],['ti-calendar-x','w','Gelmedi — Emma Fischer','16:00 randevusu, WA gönderildi','1 sa'],['ti-brand-whatsapp','a','Yeni randevu — Hans Weber','Cuma 10:00 WhatsApp\'tan aldı','2 sa']].map(([ic,t,ti,d,tm])=>(
              <div key={ti} className="ni2">
                <div className="nic" style={{background:`var(--${t==='s'?'success':t==='w'?'warning':t==='d'?'danger':'accent'}-bg)`}}>
                  <i className={`ti ${ic}`} style={{fontSize:12,color:`var(--${t==='s'?'success':t==='w'?'warning':t==='d'?'danger':'accent'})`}}/>
                </div>
                <div><div style={{fontSize:11,fontWeight:500}}>{ti}</div><div style={{fontSize:10,color:'var(--text2)'}}>{d}</div><div style={{fontSize:9,color:'var(--text3)',marginTop:1}}>{tm} önce</div></div>
              </div>
            ))}
          </div>
        </div>
        <div className="content" onClick={()=>notif&&setNotif(false)}>
          {renderPage()}
        </div>
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
